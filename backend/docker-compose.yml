services:
  postgres:
    image: postgres:16-alpine
    container_name: diwali-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: diwali
      POSTGRES_PASSWORD: diwali
      POSTGRES_DB: diwalifund
    ports:
      - '5434:5432'
    volumes:
      - diwali_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U diwali -d diwalifund']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  diwali_pgdata:
